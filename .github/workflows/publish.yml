name: Publish to Espressif Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match idf_component.yml)'
        required: true

jobs:
  publish:
    name: Publish Component & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update version in idf_component.yml
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          echo "clean_version=${VERSION}" >> $GITHUB_OUTPUT
          sed -i "s/^version: .*/version: \"${VERSION}\"/" idf_component.yml

      - name: Sync CHANGELOG to root
        run: |
          if [ -f docs/release/CHANGELOG.md ]; then
            cp docs/release/CHANGELOG.md CHANGELOG.md
          fi

      - name: Publish to ESP Component Registry
        run: |
          pip install idf-component-manager
          compote component upload --namespace hphuc15 --name WiFiPan
        env:
          IDF_COMPONENT_API_TOKEN: ${{ secrets.IDF_COMPONENT_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.clean_version }}
          name: WiFiPan v${{ steps.version.outputs.clean_version }}
          body_path: docs/release/RELEASENOTE.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}